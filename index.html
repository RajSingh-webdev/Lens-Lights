<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lens & Lights</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>
    <div class="mainbox">
        <input type="checkbox" id="check">
        <div class="btn1">
            <label for="check">
                <i class="fa-solid fa-bars" style="color: #ffffff;" ></i>
            </label>
        </div>
        <div class="sidemenu">
            <div class="logo">
                <a href="#">Lens &amp; Light</a>
            </div>
            <div class="btn2">
                <label for="check">
                    <i class="fa-solid fa-xmark" style="color: #606060;"></i>
                </label>
            </div>
            <div class="menu">
                <ul>
                    <li>
                        <i class="fa-regular fa-image" style="color: #ffffff;"></i>
                        <a href="#">Gallery</a>
                    </li>
                    <li>
                        <i class="fa-solid fa-arrow-up-right-from-square" style="color: #ffffff;"></i>
                        <a href="#">Shortcut</a>
                    </li>
                    <li>
                        <i class="fa-solid fa-photo-film" style="color: #ffffff;"></i>
                        <a href="#">Exhibits</a>
                    </li>
                    <li>
                        <i class="fa-solid fa-calendar-days" style="color: #ffffff;"></i>
                        <a href="#">Events</a>
                    </li>
                    <li>
                        <i class="fa-solid fa-store" style="color: #ffffff;"></i>
                        <a href="#">Store</a>
                    </li>
                    <li>
                        <i class="fa-solid fa-phone" style="color: #ffffff;"></i>
                        <a href="#">Contact</a>
                    </li>
                    <li>
                        <i class="fa-solid fa-comments" style="color: #ffffff;"></i>
                        <a href="#">Feedback</a>
                    </li>
                </ul>
            </div>
            <div class="slmda">
                <ul>
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
